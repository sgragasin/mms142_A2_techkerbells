<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do Good Work Tee | Zest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@300;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link href="./styles/Homestyle.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/Productstyles.css">
</head>
<body class="d-flex flex-column min-vh-100 zest-bg">

  <header>
    <nav class="navbar md:navbar-expand bg-1 border-bottom sticky-top">
      <div class="container">
        <img src="Images/alt_logo.png" alt="Zest Logo" class="logo" width="75">
        <a class="navbar-brand" href="index.html">Zest</a>
     
        <button class="btn-icon navbar-toggler" type="button"
                data-bs-toggle="drawer" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="mainNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav md:ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="index.html#about">About Us</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html#features">Shop</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
  </header>

  <main class="container my-auto py-5">
    <div class="row align-items-center g-5">
      <div class="md:col-6 text-center">
        <div id="productCarousel" class="carousel slide border border-dark" data-bs-theme="dark">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="Images/Shirt_3.png" 
                   class="d-block w-100 product-img" 
                   alt="Front view of white Do Good Work Tee showing chest typography">
            </div>
            <div class="carousel-item">
              <img src="Images/Shirt_B3.png" 
                   class="d-block w-100 product-img" 
                   alt="Back view of white Do Good Work Tee showing blue hands framing an orange star">
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous image</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next image</span>
          </button>
        </div>
      </div>

      <div class="md:col-6">
        <h1 id="productName" class="zest-heading display-4 mb-1">Do Good Work Tee</h1>
        <h2 id="productPrice" class="h2 fw-semibold mb-4">₱499</h2>

        <p class="zest-body mb-4">
          A white cotton tee featuring a front chest print and a bold back graphic of blue hands framing an orange star.
        </p>

        <hr class="border-secondary mb-4">

        <form id="orderForm">
          <div class="mb-4">
            <span id="sizeLabel" class="form-label zest-heading fs-5 d-block">Size:</span>
            <div class="d-flex gap-2" role="radiogroup" aria-labelledby="sizeLabel">
              <input type="radio" class="btn-check" name="shirtSize" id="sizeS" value="S" checked>
              <label class="btn zest-size-btn" for="sizeS">S</label>

              <input type="radio" class="btn-check" name="shirtSize" id="sizeM" value="M">
              <label class="btn zest-size-btn" for="sizeM">M</label>

              <input type="radio" class="btn-check" name="shirtSize" id="sizeL" value="L">
              <label class="btn zest-size-btn" for="sizeL">L</label>

              <input type="radio" class="btn-check" name="shirtSize" id="sizeXL" value="XL">
              <label class="btn zest-size-btn" for="sizeXL">XL</label>
            </div>
          </div>

          <div class="mb-4">
            <label for="shirtQty" class="form-label zest-heading fs-5 d-block">Quantity:</label>
            <div class="d-inline-flex align-items-center gap-2">
              <button type="button" class="btn zest-qty-btn" id="decreaseQty" aria-label="Decrease quantity">-</button>
              <input type="number" id="shirtQty" name="shirtQty" class="form-control text-center zest-qty-input" value="1" min="1" max="99" readonly>
              <button type="button" class="btn zest-qty-btn" id="increaseQty" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <button type="submit" class="btn zest-order-btn w-100 py-2 mt-2">Order Now</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-1 border-top py-7 mt-auto" id="contact">
      <div class="container d-flex flex-column md:flex-row md:justify-content-between align-items-center gap-2">
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <span class="text-dark text-decoration-none">Copyright 2026 Zest. All rights reserved.</span>
          <a href="policy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Use</a>
        </div>
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <span class="text-dark text-decoration-none">orders@examplewebsite142.com</span>
          <img src="Images/icons.png" alt="icons" class="logo" width="150">
        </div>
      </div>
    </footer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="js/order.js"></script>
</body>
</html>
